# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.47.0"
  python_check_max: "3.14"
  grep: ${{ "grep -iE" if unix else "findstr" }}

package:
  name: jedi-language-server
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/j/jedi-language-server/jedi_language_server-${{ version }}.tar.gz
    sha256: 43d9b89d07b504470544b80d76739449856a2be6565571cb362ee0681f6f0b86
    target_directory: dist
  - url: https://github.com/pappasam/jedi-language-server/archive/refs/tags/v${{ version }}.tar.gz
    sha256: c8209d976ebf2c68c2b48c3eb7fd7b4e89a9f6245c87d90d3a858c86891f84d5
    target_directory: src

build:
  number: 0
  noarch: python
  script:
    - cd dist
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
  python:
    entry_points:
      - jedi-language-server = jedi_language_server.cli:cli

requirements:
  host:
    - pip
    - hatchling
    - python ${{ python_min }}.*
  run:
    - docstring-to-markdown >=0.4,<1.0
    - cattrs >=23.1.2
    - jedi >=0.19.2,<0.21.0
    - lsprotocol >=2023.0.1
    - pygls >=2.0.0,<3
    - python >=${{ python_min }}

tests:
  - python:
      imports: jedi_language_server
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - src/tests/
    requirements:
      run:
        - pyhamcrest
        - pytest-cov
        - python ${{ python_min }}.*
        - python-lsp-jsonrpc
    script:
      - jedi-language-server --help
      - jedi-language-server --version
      - jedi-language-server --version | ${{ grep }} "${{ version | replace('.', '\\.') }}"
      - cd src
      - coverage run --source=jedi_language_server --branch -m pytest -vv --tb=long --color=yes
      - coverage report --show-missing --skip-covered --fail-under=28


about:
  summary: A language server for Jedi!
  license: MIT
  license_file: dist/LICENSE
  homepage: https://pypi.org/project/jedi-language-server
  repository: https://github.com/pappasam/jedi-language-server

extra:
  recipe-maintainers:
    - bollwyvl
